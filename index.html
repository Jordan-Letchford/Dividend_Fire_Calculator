<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dividend &amp; FIRE Planner</title>

<!-- Link to your favicon icon -->
<link rel="icon" type="image/png" href="icon.png">

<style>
  :root{
    --bg:#0B131B; --panel:#131E28; --panel2:#0F1720; --border:#26333F;
    --text:#EAF1F6; --muted:#8593A3; --dim:#5B6A78;
    --cyan:#4FC3D9; --gold:#D9A441; --green:#6FBE8F; --red:#D9695F; --purple:#B48FD9;
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.45;overflow-x:hidden;}
  h1,h2,h3{font-family:'Segoe UI',system-ui,sans-serif;margin:0;}
  input[type=number], input[type=text]{background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 8px;font-family:'Courier New',monospace;font-size:13px;width:100%;}
  input[type=number]:focus, input[type=text]:focus{outline:none;border-color:var(--cyan);}
  input[type=range]{width:100%;}
  label.field{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  button{cursor:pointer;font-family:inherit;}
  .btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:6px 12px;font-size:12px;transition:.15s;}
  .btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .btn.primary{border-color:var(--cyan);color:var(--cyan);}
  .btn.primary:hover{background:rgba(79,195,217,.1);}
  .btn.danger:hover{border-color:var(--red);color:var(--red);}
  .btn.small{padding:3px 8px;font-size:11px;}
  .wrap{max-width:1180px;margin:0 auto;padding:16px;}
  header.top{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:4px;}
  h1.title{font-size:24px;font-weight:600;}
  .sub{font-size:12.5px;color:var(--muted);max-width:620px;margin-top:6px;}
  .disclaimer{font-size:11px;color:var(--dim);max-width:260px;text-align:right;}
  .privacy{background:#101B14;border:1px solid #2A4A33;border-radius:8px;padding:10px 14px;font-size:12px;color:#9FCBAE;margin-bottom:14px;}
  .privacy b{color:#B8DFC3;}
  .support{background:#131E28;border:1px solid #26333F;border-radius:10px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  .support .stext{font-size:12px;color:#8593A3;max-width:520px;line-height:1.5;}
  .support .stext b{color:#EAF1F6;}
  .support .sbuttons{display:flex;gap:8px;flex-wrap:wrap;}
  .support a.sbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:12.5px;text-decoration:none;border:1px solid #26333F;transition:.15s;}
  .support a.sbtn.kofi{border-color:#D9A441;color:#D9A441;}
  .support a.sbtn.kofi:hover{background:rgba(217,164,65,.1);}
  .support a.sbtn.pearler{border-color:#4FC3D9;color:#4FC3D9;}
  .support a.sbtn.pearler:hover{background:rgba(79,195,217,.1);}
  .settingsbar{position:sticky;top:0;z-index:20;background:#0E1620;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  input, select{scroll-margin-top:100px;scroll-margin-bottom:120px;}
  @media (max-width:640px){
    .settingsbar{position:static;} /* pinning it eats the whole screen once the on-screen keyboard opens */
  }
  .settingsbar .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .settingsbar .row2{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12px;color:var(--muted);}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  nav.tabs button{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px 14px;font-size:12.5px;}
  nav.tabs button.active{border-color:var(--cyan);color:var(--cyan);background:rgba(79,195,217,.08);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
  .card h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .card .cardsub{font-size:12px;color:var(--muted);margin:6px 0 12px 0;line-height:1.5;}
  .help{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--dim);color:var(--dim);font-size:10px;cursor:pointer;flex-shrink:0;}
  .help:hover{border-color:var(--cyan);color:var(--cyan);}
  .helpbox{display:none;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:11.5px;color:var(--muted);margin:8px 0;line-height:1.5;}
  .helpbox.open{display:block;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);padding:6px 8px 6px 0;font-size:11px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;}
  td{padding:6px 8px 6px 0;border-bottom:1px solid #1E2A35;vertical-align:top;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:0 2px;}
  .table-scroll table{min-width:600px;}
  .table-scroll.wide table{min-width:860px;}
  .scrollhint{display:none;font-size:10px;color:var(--dim);margin-bottom:6px;}
  @media (max-width:640px){
    .scrollhint{display:block;}
    .table-scroll table{font-size:11px;}
    .table-scroll th, .table-scroll td{padding:5px 6px 5px 0;}
  }
  .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .readout{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;}
  .readout .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px;}
  .readout .val{font-family:'Courier New',monospace;font-size:20px;font-weight:600;}
  .readout .sub{font-size:11px;color:var(--dim);margin-top:2px;}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:11px;font-family:'Courier New',monospace;border:1px solid var(--border);color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .tag{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;font-family:'Courier New',monospace;}
  .tag button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px;padding:0;}
  .tag button:hover{color:var(--red);}
  .pill-toggle{display:flex;gap:4px;}
  .pill-toggle button{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:5px 10px;font-size:11px;}
  .pill-toggle button.active{background:var(--cyan);color:#0B131B;border-color:var(--cyan);}
  .insight{position:relative;padding-left:26px;margin-bottom:16px;}
  .insight .marker{position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;background:var(--panel2);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:9px;}
  .insight .ititle{font-size:13.5px;font-weight:600;margin-bottom:3px;}
  .insight .ibody{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:4px;}
  .insight .ideadline{display:inline-block;font-size:10px;padding:2px 8px;border-radius:5px;border:1px solid rgba(217,164,65,.4);color:var(--gold);}
  .warnbox{font-size:11px;color:var(--gold);display:flex;gap:6px;align-items:flex-start;background:rgba(217,164,65,.07);border:1px solid rgba(217,164,65,.25);border-radius:8px;padding:8px 10px;margin-bottom:10px;}
  .taxcompare{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:640px){.taxcompare{grid-template-columns:1fr;}}
  .taxcol{border:1px solid var(--border);border-radius:8px;padding:12px;}
  .taxcol.old{border-color:#3a3040;}
  .taxcol.new{border-color:#2A4A33;}
  .taxcol h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px;}
  .taxcol .line{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;}
  .taxcol .line b{font-family:'Courier New',monospace;}
  .taxcol .total{border-top:1px solid var(--border);margin-top:6px;padding-top:6px;font-size:13.5px;}
  footer.foot{font-size:10.5px;color:var(--dim);text-align:center;padding:20px 0 10px;line-height:1.6;}
  input[type=checkbox]{accent-color:var(--cyan);}
  #chartTooltip{font-size:11px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;display:inline-block;margin-top:6px;min-height:20px;}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:6px;font-size:11px;color:var(--muted);}
  .seqbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--panel2);border:1px dashed var(--border);border-radius:8px;min-height:38px;}
</style>
</head>
<body>
<div id="root"><div class="wrap"><div style="padding:40px;text-align:center;color:#8593A3;">Loading planner…</div></div></div>
<div id="error-box" style="display:none;padding:16px;margin:16px;border:1px solid #D9695F;border-radius:8px;background:#1A1112;color:#F2B8B5;font-family:monospace;font-size:12px;white-space:pre-wrap;"></div>
<script>
window.addEventListener('error', function (e) {
  var box = document.getElementById('error-box');
  box.style.display = 'block';
  box.textContent = 'Something failed to run:\n' + (e.message || e.error) + (e.filename ? ('\n\nFile: ' + e.filename + ':' + e.lineno) : '');
});
</script>
<script>
(function(){
"use strict";

/* ============================== DATA ============================== */

var TODAY = new Date(2026,6,24);   // 24 Jul 2026 (page build date)
var REFORM_DATE = new Date(2027,6,1); // 1 Jul 2027 CGT reform start
function monthsBetween(a,b){ return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()); }
var MONTHS_UNTIL_REFORM = monthsBetween(TODAY, REFORM_DATE); // ~11

var STOCK_DB = {
  VAS:{name:"Vanguard Australian Shares Index ETF", yieldCash:4, yieldGrossed:5.7, growth:4.5, mer:0.07, isETF:true, note:"Broad ASX 300 exposure, solid franking, moderate growth"},
  VGS:{name:"Vanguard MSCI World ex-Australia ETF", yieldCash:2, yieldGrossed:2, growth:7, mer:0.18, isETF:true, note:"Global developed markets, low yield, growth-tilted, unfranked"},
  VDHG:{name:"Vanguard Diversified High Growth ETF", yieldCash:3.4, yieldGrossed:4.3, growth:6, mer:0.27, isETF:true, note:"All-in-one diversified fund, 90% growth assets"},
  VHY:{name:"Vanguard Australian Shares High Yield ETF", yieldCash:3.6, yieldGrossed:5.1, growth:3.5, mer:0.25, isETF:true, note:"Tilts toward high-dividend AU payers, less diversified than VAS"},
  A200:{name:"BetaShares Australia 200 ETF", yieldCash:3.8, yieldGrossed:5.4, growth:4.5, mer:0.04, isETF:true, note:"Similar to VAS, lower fee, ASX 200 only"},
  IOZ:{name:"iShares Core S&P/ASX 200 ETF", yieldCash:3.8, yieldGrossed:5.3, growth:4.5, mer:0.05, isETF:true, note:"Similar to VAS/A200, ASX 200 only, low fee"},
  STW:{name:"SPDR S&P/ASX 200 Fund", yieldCash:3.7, yieldGrossed:5.2, growth:4.5, mer:0.13, isETF:true, note:"One of the oldest AU index ETFs, ASX 200 only, slightly higher fee"},
  MVW:{name:"VanEck Australian Equal Weight ETF", yieldCash:4, yieldGrossed:5.6, growth:4, mer:0.35, isETF:true, note:"Equal-weights holdings instead of market-cap weighting, less bank/mining concentration"},
  IVV:{name:"iShares S&P 500 ETF (AU)", yieldCash:1.2, yieldGrossed:1.2, growth:8.5, mer:0.04, isETF:true, note:"US large-cap, low yield, strong historical growth, unfranked"},
  VTS:{name:"Vanguard US Total Market Shares Index ETF", yieldCash:1.1, yieldGrossed:1.1, growth:8.5, mer:0.03, isETF:true, note:"Broader than IVV (includes mid/small-cap US), low yield, unfranked"},
  NDQ:{name:"BetaShares NASDAQ 100 ETF", yieldCash:0.5, yieldGrossed:0.5, growth:10, mer:0.48, isETF:true, note:"US tech-heavy, very low yield, high growth and volatility"},
  QUAL:{name:"VanEck MSCI International Quality ETF", yieldCash:1.3, yieldGrossed:1.3, growth:8, mer:0.4, isETF:true, note:"Global large-caps screened for quality factors, low yield, unfranked"},
  MOAT:{name:"VanEck Morningstar Wide Moat ETF", yieldCash:0.8, yieldGrossed:0.8, growth:8, mer:0.49, isETF:true, note:"US companies with durable competitive advantages, low yield, unfranked"},
  ETHI:{name:"BetaShares Global Sustainability Leaders ETF", yieldCash:0.7, yieldGrossed:0.7, growth:8, mer:0.59, isETF:true, note:"Ethical/ESG screened global shares, low yield, unfranked"},
  VAP:{name:"Vanguard Australian Property Securities ETF", yieldCash:4.5, yieldGrossed:4.8, growth:3, mer:0.23, isETF:true, note:"AU listed property (REITs), interest-rate sensitive"},
  VEU:{name:"Vanguard All-World ex-US ETF", yieldCash:2.8, yieldGrossed:2.8, growth:6, mer:0.08, isETF:true, note:"Diversifies away from US-heavy funds like VGS, unfranked"},
  VGE:{name:"Vanguard FTSE Emerging Markets ETF", yieldCash:2.6, yieldGrossed:2.6, growth:5.5, mer:0.48, isETF:true, note:"Emerging markets, higher volatility and currency risk"},
  VAF:{name:"Vanguard Australian Fixed Interest Index ETF", yieldCash:3.8, yieldGrossed:3.8, growth:1, mer:0.2, isETF:true, note:"AU bonds, low growth, defensive/income asset not a growth holding"},
  VGB:{name:"Vanguard Australian Government Bond Index ETF", yieldCash:3.5, yieldGrossed:3.5, growth:0.5, mer:0.2, isETF:true, note:"Government bonds only, defensive, lowest-risk income in this list"},
  AAA:{name:"BetaShares Australian High Interest Cash ETF", yieldCash:4, yieldGrossed:4, growth:0, mer:0.18, isETF:true, note:"Cash-like ETF, near-zero capital growth, used for stability not growth"},
  SYI:{name:"SPDR MSCI Australia Select High Dividend Yield Fund", yieldCash:5.2, yieldGrossed:7.2, growth:2, mer:0.35, isETF:true, note:"Screens for high, sustainable dividends, more concentrated than VAS, financials/mining heavy"},
  IHD:{name:"iShares S&P/ASX Dividend Opportunities ETF", yieldCash:5, yieldGrossed:6.9, growth:2, mer:0.3, isETF:true, note:"High-yield AU dividend screen, concentrated, similar trade-off to SYI/VHY"},
  HVST:{name:"BetaShares Australian Dividend Harvester Fund", yieldCash:7.5, yieldGrossed:8.5, growth:-1, mer:0.9, isETF:true, note:"Covered-call income fund: yield is generated partly by capping capital growth, not just from underlying dividends"},
  YMAX:{name:"BetaShares Australian Top 20 Equity Yield Maximiser Fund", yieldCash:8.5, yieldGrossed:10, growth:-2, mer:0.68, isETF:true, note:"Covered-call on ASX top 20, very high yield but growth is deliberately capped, concentrated in a handful of large caps"},
  HYLD:{name:"BetaShares Australian Major Bank Hybrids Index ETF", yieldCash:5.5, yieldGrossed:5.5, growth:0.5, mer:0.45, isETF:true, note:"Bank hybrid securities, income-focused, concentrated entirely in the big four banks, different risk profile to equities"},
  HLI:{name:"Helia Group Ltd", yieldCash:5.7, yieldGrossed:7.6, growth:3, mer:0, isETF:false, note:"Single company (mortgage insurer), higher yield but no diversification, no management fee since it isn't a fund"},
  CBA:{name:"Commonwealth Bank of Australia", yieldCash:3.2, yieldGrossed:4.6, growth:6, mer:0, isETF:false, note:"Single company (largest AU bank), fully franked, no management fee, concentration risk"},
  BHP:{name:"BHP Group Ltd", yieldCash:4.8, yieldGrossed:6.5, growth:3, mer:0, isETF:false, note:"Single company (mining), fully franked, dividend varies a lot with commodity prices"},
  CSL:{name:"CSL Limited", yieldCash:1.1, yieldGrossed:1.5, growth:8, mer:0, isETF:false, note:"Single company (biotech), low yield, growth-focused, partly franked"},
  WES:{name:"Wesfarmers Ltd", yieldCash:2.8, yieldGrossed:4, growth:6, mer:0, isETF:false, note:"Single company (retail conglomerate, Bunnings/Kmart/Officeworks), fully franked"}
};
var GENERIC_DEFAULT = {name:"Unrecognised ticker", yieldCash:3, yieldGrossed:3.5, growth:6, mer:0.2, isETF:null, note:"Placeholder figures — edit these"};

/* Builds a link to the ASX quote page for a ticker. ASX splits its site into two separate templates:
   /markets/etp/{code} for ETFs and other exchange-traded products, /markets/company/{code} for
   individual companies. There's no single URL that resolves both, and getting it wrong returns a
   dead page, so when the type is known (isETF true/false) we link straight to the right one. When
   it's unknown (a manually typed ticker not in the database) we show both options rather than guess
   and risk a broken link. */
function asxUrl(ticker, isETF){
  var t=encodeURIComponent(String(ticker).toUpperCase());
  return "https://www.asx.com.au/markets/"+(isETF?"etp":"company")+"/"+t;
}
function asxLinkHtml(ticker, isETF){
  if(isETF===true || isETF===false){
    return '<a href="'+asxUrl(ticker,isETF)+'" target="_blank" rel="noopener" class="btn small" style="text-decoration:none;">View on ASX &#8599;</a>';
  }
  return '<span style="display:inline-flex;gap:4px;flex-wrap:wrap;">'+
    '<a href="'+asxUrl(ticker,true)+'" target="_blank" rel="noopener" class="btn small" style="text-decoration:none;">As fund/ETF &#8599;</a>'+
    '<a href="'+asxUrl(ticker,false)+'" target="_blank" rel="noopener" class="btn small" style="text-decoration:none;">As company &#8599;</a>'+
  '</span>';
}

/* Flat-fee broker presets. Figures are rough, publicly-advertised headline rates as at mid-2026 for a
   typical few-thousand-dollar ETF order, editable once selected since real pricing can be tiered. */
var BROKER_DB = {
  pearler:{name:"Pearler", buyFee:6.50, sellFee:6.50, note:"Flat fee, CHESS-sponsored. Some ETFs get free brokerage if held 12+ months — not modelled here, treated as a conservative default."},
  stake:{name:"Stake (ASX)", buyFee:3.00, sellFee:3.00, note:"Flat ASX brokerage."},
  superhero:{name:"Superhero", buyFee:2.00, sellFee:2.00, note:"Flat ETF brokerage."},
  selfwealth:{name:"SelfWealth", buyFee:9.50, sellFee:9.50, note:"Flat brokerage regardless of order size."},
  commsec:{name:"CommSec", buyFee:19.95, sellFee:19.95, note:"Tiered pricing — this is an approximate fee for a typical few-thousand-dollar order, not a fixed rate."},
  cmc:{name:"CMC Markets", buyFee:9.90, sellFee:9.90, note:"Tiered pricing — approximate fee for a typical order size."},
  betashares:{name:"Betashares Direct", buyFee:0, sellFee:0, note:"Free via auto-invest, limited to Betashares-issued ETFs (e.g. A200, NDQ). Other trades may incur fees."},
  custom:{name:"Custom / other broker", buyFee:6.50, sellFee:6.50, note:"Type in your own broker's fee."}
};
var PALETTE = ["#4FC3D9","#D9A441","#6FBE8F","#D9695F","#B48FD9","#7FA8D9","#D9C24F","#5FA8A0"];

/* Income tax brackets, resident individual, excl. Medicare levy (added separately) */
var BRACKETS = {
  2025: [[0,18200,0],[18200,45000,0.16],[45000,135000,0.30],[135000,190000,0.37],[190000,Infinity,0.45]],
  2026: [[0,18200,0],[18200,45000,0.15],[45000,135000,0.30],[135000,190000,0.37],[190000,Infinity,0.45]]
};
function incomeTax(taxableIncome, ruleYear){
  if(taxableIncome<=0) return 0;
  var b = BRACKETS[ruleYear];
  var tax=0;
  for(var i=0;i<b.length;i++){
    var lo=b[i][0], hi=b[i][1], rate=b[i][2];
    if(taxableIncome>lo) tax += (Math.min(taxableIncome,hi)-lo)*rate;
  }
  return tax + taxableIncome*0.02; // 2% Medicare levy, flat-rate simplification
}

/* ============================== STATE ============================== */

var state = {
  stocks: [
    {id:1, ticker:"VAS", name:STOCK_DB.VAS.name, balance:10000, yieldCash:4, yieldGrossed:5.7, growth:4.5, mer:0.07, color:PALETTE[0], isETF:true},
    {id:2, ticker:"VGS", name:STOCK_DB.VGS.name, balance:10000, yieldCash:2, yieldGrossed:2, growth:7, mer:0.18, color:PALETTE[1], isETF:true}
  ],
  broker:{id:"pearler", buyFee:BROKER_DB.pearler.buyFee, sellFee:BROKER_DB.pearler.sellFee},
  monthlyContribution:1000,
  currentAge:25,
  inflation:3,
  adjustInflation:true,
  targetDividend:50000,
  targetAge:50,
  yieldView:"both",
  contribMode:"rotate",          // 'rotate' | 'custom'
  customSequence:[],             // array of stock ids
  reallocAge:null,
  reallocTargets:[],
  scenarios:[],
  activeTab:"summary",
  chartTab:"dividend",
  newTicker:"",
  newBalance:1000,
  tax:{
    salary:90000,
    sellStockId:null,   // set on init
    sellPercent:100,
    sellAge:50
  }
};
state.tax.sellStockId = state.stocks[0].id;

/* ============================== ENGINE ============================== */

function activeSequence(){
  if(state.contribMode==="custom" && state.customSequence.length>0) return state.customSequence.slice();
  return state.stocks.map(function(s){return s.id;});
}

function simulateMulti(opts){
  var stocks=opts.stocks, monthlyContribution=opts.monthlyContribution, months=opts.months,
      reallocation=opts.reallocation, yieldField=opts.yieldField, sequence=opts.sequence,
      lumpSum=opts.lumpSum||0, lumpSumStockId=opts.lumpSumStockId, brokerBuyFee=opts.brokerBuyFee||0;
  var bal={};
  stocks.forEach(function(s){
    var extra = (lumpSumStockId===s.id)?lumpSum:0;
    bal[s.id]={pre:s.balance+extra, post:0, costPre:s.balance+extra, costPost:0};
  });
  var monthlyGrowth={};
  stocks.forEach(function(s){ var netGrowth=s.growth-(s.mer||0); monthlyGrowth[s.id]=Math.pow(1+netGrowth/100,1/12)-1; });
  var quarterDiv=0, cashPool=0, cumFees=0;
  var results=[];
  for(var m=1;m<=months;m++){
    var postReform = m>MONTHS_UNTIL_REFORM;
    var divThisMonth=0;
    stocks.forEach(function(s){ var b=bal[s.id]; divThisMonth += (b.pre+b.post)*(s[yieldField]/100/12); });
    quarterDiv+=divThisMonth;
    stocks.forEach(function(s){ var b=bal[s.id]; var g=1+monthlyGrowth[s.id]; b.pre*=g; b.post*=g; });
    if(m%3===0){ cashPool+=quarterDiv; quarterDiv=0; }
    var grossBuyAmount = monthlyContribution + cashPool;
    cashPool=0;
    var feePaid = Math.min(grossBuyAmount, brokerBuyFee);
    var buyAmount = grossBuyAmount - feePaid;
    cumFees += feePaid;
    var activeIds = (reallocation && m>reallocation.thresholdMonth && reallocation.targetIds.length>0) ? reallocation.targetIds : sequence;
    var targetId = activeIds[(m-1)%activeIds.length];
    var b2 = bal[targetId];
    if(postReform){ b2.post+=buyAmount; b2.costPost+=buyAmount; } else { b2.pre+=buyAmount; b2.costPre+=buyAmount; }
    var totalValue=0, totalCostBase=0, annualDividendRunRate=0;
    stocks.forEach(function(s){
      var b=bal[s.id];
      totalValue += b.pre+b.post;
      totalCostBase += b.costPre+b.costPost;
      annualDividendRunRate += (b.pre+b.post)*(s[yieldField]/100);
    });
    var snap={}; stocks.forEach(function(s){ snap[s.id]={pre:bal[s.id].pre,post:bal[s.id].post,costPre:bal[s.id].costPre,costPost:bal[s.id].costPost}; });
    results.push({month:m, totalValue:totalValue, totalCostBase:totalCostBase, annualDividendRunRate:annualDividendRunRate, postReform:postReform, bal:snap, cumBrokerFees:cumFees});
  }
  return results;
}

function findCrossingMonth(res, target, inflRate){
  for(var i=0;i<res.length;i++){
    var r=res[i];
    var adjTarget = inflRate ? target*Math.pow(1+inflRate, r.month/12) : target;
    if(r.annualDividendRunRate>=adjTarget) return r.month;
  }
  return null;
}

function solveMonthlyContribution(params, targetMonth, targetDividend, inflRate){
  var lo=0, hi=80000;
  for(var i=0;i<40;i++){
    var mid=(lo+hi)/2;
    var res=simulateMulti(Object.assign({},params,{monthlyContribution:mid, months:targetMonth}));
    var point=res[targetMonth-1];
    var adjTarget = inflRate? targetDividend*Math.pow(1+inflRate, targetMonth/12): targetDividend;
    if(point.annualDividendRunRate<adjTarget) lo=mid; else hi=mid;
  }
  return hi;
}
function solveLumpSum(params, targetMonth, targetDividend, inflRate, lumpSumStockId){
  var lo=0, hi=2000000;
  for(var i=0;i<40;i++){
    var mid=(lo+hi)/2;
    var res=simulateMulti(Object.assign({},params,{months:targetMonth, lumpSum:mid, lumpSumStockId:lumpSumStockId}));
    var point=res[targetMonth-1];
    var adjTarget = inflRate? targetDividend*Math.pow(1+inflRate, targetMonth/12): targetDividend;
    if(point.annualDividendRunRate<adjTarget) lo=mid; else hi=mid;
  }
  return hi;
}

function dividendTaxImpact(salary, cashDiv, frankingCredit, ruleYear){
  var grossedUp = cashDiv+frankingCredit;
  var taxWithout = incomeTax(salary, ruleYear);
  var taxWith = incomeTax(salary+grossedUp, ruleYear);
  var taxOnDividends = taxWith-taxWithout;
  var net = taxOnDividends - frankingCredit;
  return {grossedUp:grossedUp, taxOnDividends:taxOnDividends, net:net};
}

/* Compare 2025-style rules (flat 50% discount forever) vs actual 2026 law (legacy discount pre-reform,
   indexation + 30% minimum tax on real gains after 1 Jul 2027). Approximate model for education. */
function cgtCompare(snapshot, stockId, sellFraction, salary, inflationPct, sellMonth, sellFee){
  sellFee = sellFee||0;
  var b = snapshot.bal[stockId];
  // brokerage on the sale reduces capital proceeds. Apportion the flat fee across the pre/post reform
  // slices in proportion to how much of the sold parcel sits in each, then deduct it from proceeds once.
  var preShare = (b.pre+b.post)>0 ? b.pre/(b.pre+b.post) : 0;
  var feePre = sellFee*preShare, feePost = sellFee-feePre;
  var balancePostSold = Math.max(0, b.post*sellFraction - feePost);
  var costBasePostSold = b.costPost*sellFraction;
  var balancePreSold = Math.max(0, b.pre*sellFraction - feePre);
  var costBasePreSold = b.costPre*sellFraction;
  var gainPreRaw = Math.max(0, balancePreSold-costBasePreSold);
  var gainPostRaw = Math.max(0, balancePostSold-costBasePostSold);

  // hypothetical "2025 rules continued": flat 50% discount on everything, no minimum tax floor
  var totalGainOld = Math.max(0,balancePreSold-costBasePreSold) + Math.max(0,balancePostSold-costBasePostSold);
  var taxableOld = totalGainOld*0.5;
  var taxOld = incomeTax(salary+taxableOld,2025) - incomeTax(salary,2025);

  // actual 2026 law: pre-reform gain keeps legacy 50% discount; post-reform gain uses CPI-indexed cost base + 30% floor
  var taxablePreDiscounted = gainPreRaw*0.5;
  var yearsPostReform = Math.max(0,(sellMonth-MONTHS_UNTIL_REFORM))/12;
  // costBasePost builds up gradually via regular contributions across the whole post-reform window, not as a
  // single lump on the reform date, so index it using the average holding period (half the elapsed window)
  // rather than the full window. Simplified but far more realistic for a dollar-cost-averaged holding.
  var indexedCostBasePost = costBasePostSold*Math.pow(1+inflationPct/100, yearsPostReform/2);
  var realGainPost = Math.max(0, balancePostSold-indexedCostBasePost);
  var taxA = incomeTax(salary+taxablePreDiscounted,2026) - incomeTax(salary,2026);
  var taxB = incomeTax(salary+taxablePreDiscounted+realGainPost,2026) - incomeTax(salary,2026);
  var attributablePostTax = Math.max(taxB-taxA, realGainPost*0.30);
  var taxNew = taxA+attributablePostTax;

  return {
    gainPreRaw:gainPreRaw, gainPostRaw:gainPostRaw, totalGainOld:totalGainOld, taxableOld:taxableOld, taxOld:taxOld,
    taxablePreDiscounted:taxablePreDiscounted, realGainPost:realGainPost, taxNew:taxNew,
    totalGainNew: gainPreRaw+gainPostRaw
  };
}

/* ============================== FORMAT HELPERS ============================== */

function fmtFull(n){ return new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD",maximumFractionDigits:0}).format(n||0); }
function fmtPrecise(n){ return new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD",minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0); }
function fmtCompact(n){ return new Intl.NumberFormat("en-AU",{notation:"compact",maximumFractionDigits:1}).format(n||0); }
function fmtPct(n){ return (n||0).toFixed(1)+"%"; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* Parses a number field as the user types. Returns null (meaning "don't commit yet, still typing")
   for blanks/partial entries like "-", ".", "-." or anything non-numeric, so a stray keystroke never
   snaps the field to 0 or wipes what's been typed. Only a genuinely parseable number gets clamped
   and committed to state. */
function parseNumInput(raw, opts){
  opts=opts||{};
  if(raw==null) return null;
  raw=String(raw).trim();
  if(raw===""||raw==="-"||raw==="."||raw==="-."||raw==="-0") return null;
  if(!/^-?\d*\.?\d*$/.test(raw)) return null; // rejects letters/symbols outright
  var n=parseFloat(raw);
  if(!isFinite(n)) return null;
  if(opts.min!=null) n=Math.max(opts.min,n);
  if(opts.max!=null) n=Math.min(opts.max,n);
  return n;
}
function cssEscape(s){
  if(window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/[^a-zA-Z0-9_-]/g,"\\$&");
}

/* ============================== CHART (vanilla SVG) ============================== */

function renderLineChart(containerId, data, series, opts){
  opts=opts||{};
  var width=760, height=opts.height||300;
  var padding={top:12,right:16,bottom:30,left:60};
  var innerW=width-padding.left-padding.right, innerH=height-padding.top-padding.bottom;
  var allValues=[];
  data.forEach(function(d){ series.forEach(function(s){ if(Number.isFinite(d[s.key])) allValues.push(d[s.key]); }); });
  var maxV=Math.max.apply(null,allValues.concat([1]));
  function xScale(i){ return padding.left + (data.length<=1?0:i/(data.length-1)*innerW); }
  function yScale(v){ return padding.top+innerH - (v/maxV)*innerH; }
  function linePath(key){
    return data.map(function(d,i){ return (i===0?"M ":"L ")+xScale(i).toFixed(1)+" "+yScale(d[key]).toFixed(1); }).join(" ");
  }
  var grid=[0,0.25,0.5,0.75,1];
  var xTickEvery=Math.max(1,Math.round(data.length/8));
  var svg = '<svg viewBox="0 0 '+width+' '+height+'" style="width:100%;height:auto;" data-chart="1">';
  grid.forEach(function(g){
    var y=padding.top+innerH-g*innerH;
    svg += '<line x1="'+padding.left+'" y1="'+y+'" x2="'+(width-padding.right)+'" y2="'+y+'" stroke="#1E2A35" stroke-dasharray="3 3"/>';
    svg += '<text x="'+(padding.left-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="#5B6A78" font-family="monospace">'+fmtCompact(g*maxV)+'</text>';
  });
  data.forEach(function(d,i){
    if(i%xTickEvery===0){
      svg += '<text x="'+xScale(i)+'" y="'+(height-padding.bottom+16)+'" text-anchor="middle" font-size="10" fill="#5B6A78" font-family="monospace">'+d.age+'</text>';
    }
  });
  series.forEach(function(s){
    svg += '<path d="'+linePath(s.key)+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.dash?1.5:2)+'"'+(s.dash?' stroke-dasharray="5 4"':'')+'/>';
  });
  svg += '</svg>';
  var legend = '<div class="legend">'+series.map(function(s){
    return '<span style="display:flex;align-items:center;gap:5px;"><span style="width:12px;height:2px;background:'+s.color+';display:inline-block;"></span>'+esc(s.name)+'</span>';
  }).join("")+'</div>';
  var el=document.getElementById(containerId);
  el.innerHTML = legend+svg+'<div id="'+containerId+'_tt"></div>';
  var svgEl = el.querySelector("svg");
  var tt = document.getElementById(containerId+"_tt");
  svgEl.addEventListener("mousemove", function(e){
    var rect=svgEl.getBoundingClientRect();
    var relX=(e.clientX-rect.left)/rect.width*width;
    var idx=Math.round((relX-padding.left)/innerW*(data.length-1));
    idx=Math.max(0,Math.min(data.length-1,idx));
    var d=data[idx];
    var html='<b style="color:#7E93A3;">Age '+d.age+'</b><br/>'+series.map(function(s){
      return '<span style="color:'+s.color+';">&#9679;</span> '+esc(s.name)+': <b style="font-family:monospace;">'+fmtFull(d[s.key])+'</b>';
    }).join("<br/>");
    tt.innerHTML='<div style="background:#0F1720;border:1px solid #26333F;border-radius:6px;padding:8px 10px;font-size:11px;display:inline-block;">'+html+'</div>';
  });
  svgEl.addEventListener("mouseleave", function(){ tt.innerHTML=""; });
}

function gaugeSVG(pct, primaryValue, primaryLabel, secondaryLabel){
  var clamped=Math.max(0,Math.min(1,pct));
  var R=80,CX=100,CY=104;
  var semi=Math.PI*R;
  var angle=(180-clamped*180)*(Math.PI/180);
  var needleX=CX+(R-14)*Math.cos(angle), needleY=CY-(R-14)*Math.sin(angle);
  var ticks=[0,0.25,0.5,0.75,1];
  var s='<svg viewBox="0 0 200 120" style="width:100%;max-width:260px;display:block;margin:0 auto;">';
  s+='<path d="M '+(CX-R)+' '+CY+' A '+R+' '+R+' 0 0 1 '+(CX+R)+' '+CY+'" fill="none" stroke="#26333F" stroke-width="10" stroke-linecap="round"/>';
  s+='<path d="M '+(CX-R)+' '+CY+' A '+R+' '+R+' 0 0 1 '+(CX+R)+' '+CY+'" fill="none" stroke="#4FC3D9" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(clamped*semi)+' '+semi+'"/>';
  ticks.forEach(function(t){
    var a=(180-t*180)*(Math.PI/180);
    var x1=CX+(R+6)*Math.cos(a), y1=CY-(R+6)*Math.sin(a), x2=CX+(R+13)*Math.cos(a), y2=CY-(R+13)*Math.sin(a);
    s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#4A5A68" stroke-width="2"/>';
  });
  s+='<line x1="'+CX+'" y1="'+CY+'" x2="'+needleX+'" y2="'+needleY+'" stroke="#D9A441" stroke-width="3" stroke-linecap="round"/>';
  s+='<circle cx="'+CX+'" cy="'+CY+'" r="5" fill="#D9A441"/>';
  s+='<text x="'+CX+'" y="'+(CY-22)+'" text-anchor="middle" fill="#EAF1F6" font-size="18" font-family="monospace" font-weight="600">'+esc(primaryValue)+'</text>';
  s+='<text x="'+CX+'" y="'+(CY-6)+'" text-anchor="middle" fill="#7E93A3" font-size="8.5">'+esc(primaryLabel)+'</text>';
  s+='<text x="'+CX+'" y="'+(CY+16)+'" text-anchor="middle" fill="#5B6A78" font-size="8">'+esc(secondaryLabel)+'</text>';
  s+='</svg>';
  return s;
}

/* ============================== DERIVED STATE ============================== */

function derive(){
  var months=40*12;
  var seq=activeSequence();
  var reallocation = (state.reallocAge!=null && state.reallocTargets.length>0) ? {thresholdMonth:(state.reallocAge-state.currentAge)*12, targetIds:state.reallocTargets} : null;
  var brokerBuyFee = state.broker.buyFee||0;
  var baseArgs={stocks:state.stocks, monthlyContribution:state.monthlyContribution, months:months, reallocation:reallocation, sequence:seq, brokerBuyFee:brokerBuyFee};
  var simCash=simulateMulti(Object.assign({},baseArgs,{yieldField:"yieldCash"}));
  var simGrossed=simulateMulti(Object.assign({},baseArgs,{yieldField:"yieldGrossed"}));
  var inflRate = state.adjustInflation ? state.inflation/100 : 0;
  var crossCashMonth=findCrossingMonth(simCash, state.targetDividend, inflRate);
  var crossGrossedMonth=findCrossingMonth(simGrossed, state.targetDividend, inflRate);

  // zero-fee comparison run (no MER drag, no brokerage) purely to quantify fee impact
  var noFeeStocks = state.stocks.map(function(s){ return Object.assign({},s,{mer:0}); });
  var simCashNoFee = simulateMulti(Object.assign({},baseArgs,{stocks:noFeeStocks, yieldField:"yieldCash", brokerBuyFee:0}));

  var chartData=[];
  for(var y=0;y<=40;y++){
    var m=y===0?1:y*12;
    var c=simCash[m-1], g=simGrossed[m-1];
    var target = state.adjustInflation ? state.targetDividend*Math.pow(1+inflRate,y) : state.targetDividend;
    chartData.push({age:state.currentAge+y, cashDividend:Math.round(c.annualDividendRunRate), grossedDividend:Math.round(g.annualDividendRunRate),
      cashValue:Math.round(c.totalValue), cashCostBase:Math.round(c.totalCostBase), target:Math.round(target)});
  }

  var targetMonth=(state.targetAge-state.currentAge)*12;
  var yieldField = state.yieldView==="grossed"?"yieldGrossed":"yieldCash";
  var reqContribCash=null, reqContribGrossed=null;
  if(targetMonth>0){
    reqContribCash = solveMonthlyContribution({stocks:state.stocks, reallocation:reallocation, yieldField:"yieldCash", sequence:seq, brokerBuyFee:brokerBuyFee}, targetMonth, state.targetDividend, inflRate);
    reqContribGrossed = solveMonthlyContribution({stocks:state.stocks, reallocation:reallocation, yieldField:"yieldGrossed", sequence:seq, brokerBuyFee:brokerBuyFee}, targetMonth, state.targetDividend, inflRate);
  }

  var totalBalance = state.stocks.reduce(function(s,st){return s+st.balance;},0);
  var currentRunRateCash = state.stocks.reduce(function(s,st){return s+st.balance*(st.yieldCash/100);},0);
  var currentRunRateGrossed = state.stocks.reduce(function(s,st){return s+st.balance*(st.yieldGrossed/100);},0);
  var blendedYieldCash = totalBalance>0? currentRunRateCash/totalBalance : 0;
  var gaugePct = state.targetDividend>0 ? currentRunRateCash/state.targetDividend : 0;
  var highestYieldStock = state.stocks.slice().sort(function(a,b){return b[yieldField]-a[yieldField];})[0];

  var feeCheckMonth = Math.min(months, targetMonth>0?targetMonth:months);
  var feeImpact = {
    month: feeCheckMonth,
    valueWithFees: simCash[feeCheckMonth-1].totalValue,
    valueNoFees: simCashNoFee[feeCheckMonth-1].totalValue,
    brokerageSoFar: simCash[feeCheckMonth-1].cumBrokerFees
  };
  feeImpact.gap = feeImpact.valueNoFees - feeImpact.valueWithFees;

  // Sensitivity: what happens if the long-run growth or yield assumption is off by a couple of
  // percentage points, in either direction, from what's set in Holdings. Always measured against
  // the current target dividend and age, on the cash-yield basis (the more conservative of the two).
  var sensitivityMonths = Math.max(months, (state.targetAge-state.currentAge)*12+1);
  function runSensitivity(deltas, mode){
    return deltas.map(function(delta){
      var adjStocks = state.stocks.map(function(s){
        var ns={}; for(var k in s) ns[k]=s[k];
        if(mode==="growth") ns.growth = s.growth+delta;
        else { ns.yieldCash = Math.max(0, s.yieldCash+delta); ns.yieldGrossed = Math.max(0, s.yieldGrossed+delta); }
        return ns;
      });
      var res = simulateMulti({stocks:adjStocks, monthlyContribution:state.monthlyContribution, months:sensitivityMonths, reallocation:reallocation, sequence:seq, brokerBuyFee:brokerBuyFee, yieldField:"yieldCash"});
      var crossM = findCrossingMonth(res, state.targetDividend, inflRate);
      return {delta:delta, years: crossM? crossM/12 : null, age: crossM? state.currentAge+crossM/12 : null, endValue: res[res.length-1].totalValue};
    });
  }
  var growthSensitivity = runSensitivity([-2,-1,0,1,2], "growth");
  var yieldSensitivity = runSensitivity([-1,-0.5,0,0.5,1], "yield");

  return {
    months:months, seq:seq, reallocation:reallocation, simCash:simCash, simGrossed:simGrossed, inflRate:inflRate,
    crossCashMonth:crossCashMonth, crossGrossedMonth:crossGrossedMonth, chartData:chartData, targetMonth:targetMonth,
    yieldField:yieldField, reqContribCash:reqContribCash, reqContribGrossed:reqContribGrossed,
    totalBalance:totalBalance, currentRunRateCash:currentRunRateCash, currentRunRateGrossed:currentRunRateGrossed,
    blendedYieldCash:blendedYieldCash, gaugePct:gaugePct, highestYieldStock:highestYieldStock,
    brokerBuyFee:brokerBuyFee, sellFee:state.broker.sellFee||0, feeImpact:feeImpact,
    growthSensitivity:growthSensitivity, yieldSensitivity:yieldSensitivity
  };
}

/* ============================== ACTIONS (global, called from inline handlers) ============================== */

function updateStock(id, field, value){
  var s=state.stocks.find(function(x){return x.id===id;});
  if(!s) return;
  var bounds={balance:{min:0}, yieldCash:{min:0,max:100}, yieldGrossed:{min:0,max:100}, growth:{min:-50,max:100}, mer:{min:0,max:5}};
  if(bounds[field]){
    var n=parseNumInput(value, bounds[field]);
    if(n===null){ render(); return; }
    s[field]=n;
  }
  render();
}
function removeStock(id){
  if(state.stocks.length<=1) return;
  state.stocks = state.stocks.filter(function(s){return s.id!==id;});
  state.reallocTargets = state.reallocTargets.filter(function(t){return t!==id;});
  state.customSequence = state.customSequence.filter(function(t){return t!==id;});
  state.scenarios.forEach(function(sc){ if(sc.targetId===id) sc.targetId = state.stocks[0]?state.stocks[0].id:null; });
  if(state.tax.sellStockId===id) state.tax.sellStockId = state.stocks[0]?state.stocks[0].id:null;
  render();
}
function addStock(){
  var key=(state.newTicker||"").trim().toUpperCase();
  if(!key) return;
  var hit=STOCK_DB[key];
  var id=Math.max.apply(null,state.stocks.map(function(s){return s.id;}).concat([0]))+1;
  var color=PALETTE[state.stocks.length%PALETTE.length];
  var d=hit||GENERIC_DEFAULT;
  state.stocks.push({id:id, ticker:key, name:d.name, balance:state.newBalance||0, yieldCash:d.yieldCash, yieldGrossed:d.yieldGrossed, growth:d.growth, mer:d.mer||0, color:color, isEstimate:true, unrecognized:!hit, isETF:hit?d.isETF:null});
  state.newTicker=""; state.newBalance=0;
  render();
}
function toggleReallocTarget(id){
  var i=state.reallocTargets.indexOf(id);
  if(i>=0) state.reallocTargets.splice(i,1); else state.reallocTargets.push(id);
  render();
}
function clearRealloc(){ state.reallocAge=null; state.reallocTargets=[]; render(); }
function setContribMode(mode){ state.contribMode=mode; render(); }
function appendSequence(id){ state.customSequence.push(id); render(); }
function removeSequenceAt(idx){ state.customSequence.splice(idx,1); render(); }
function clearSequence(){ state.customSequence=[]; render(); }
function addScenario(){
  var id=Math.max.apply(null,state.scenarios.map(function(s){return s.id;}).concat([0]))+1;
  var color=PALETTE[(state.scenarios.length+3)%PALETTE.length];
  state.scenarios.push({id:id, label:"Scenario "+id, contributionDelta:500, reallocateAge:null, targetId:state.stocks[0]?state.stocks[0].id:null, color:color});
  render();
}
function removeScenario(id){ state.scenarios=state.scenarios.filter(function(s){return s.id!==id;}); render(); }
function updateScenario(id, field, value){
  var s=state.scenarios.find(function(x){return x.id===id;});
  if(!s) return;
  if(field==="label"){
    // purely cosmetic, nothing else on the page reads it, so skip the re-render entirely: rebuilding
    // this input's DOM node on every keystroke was breaking mobile keyboard autocomplete/composition,
    // which is what caused typing to appear "stuck" after the first letter
    s.label=value;
    return;
  }
  else if(field==="contributionDelta"){
    var n=parseNumInput(value,{min:-100000,max:100000});
    if(n===null){ render(); return; }
    s.contributionDelta=n;
  }
  else if(field==="targetId") s.targetId=parseInt(value);
  else if(field==="reallocateAge"){
    if(value===""){ s.reallocateAge=null; render(); return; }
    var n2=parseNumInput(value,{min:0,max:120});
    if(n2===null){ render(); return; }
    s.reallocateAge=n2;
  }
  render();
}
function setBroker(id){
  state.broker.id=id;

  if(b){ state.broker.buyFee=b.buyFee; state.broker.sellFee=b.sellFee; }

function setTab(t){ state.activeTab=t; render(); }
function setChartTab(t){ state.chartTab=t; render(); }
function toggleHelp(id){
  var el=document.getElementById(id);
  if(el) el.classList.toggle("open");
}
function setField(path, value, isFloat, opts){
  var parts=path.split(".");
  var obj=state;
  for(var i=0;i<parts.length-1;i++) obj=obj[parts[i]];
  if(isFloat){
    var n=parseNumInput(value, opts);
    if(n===null){ render(); return; } // still mid-keystroke, just refresh dependent numbers, don't commit
    obj[parts[parts.length-1]] = n;
  } else {
    obj[parts[parts.length-1]] = value;
  }
  render();
}
function setBoolField(path, checked){
  var parts=path.split(".");
  var obj=state;
  for(var i=0;i<parts.length-1;i++) obj=obj[parts[i]];
  obj[parts[parts.length-1]] = checked;
  render();
}

var compState = null; // lazily initialised from derived totals, persists across renders once touched
var lastScrolledField = null; // guards against re-scrolling on every keystroke while typing
function renderCompoundCalc(d){
  if(compState===null){
    var blendedGrowth = d.totalBalance>0 ? state.stocks.reduce(function(s,st){return s+st.balance*st.growth;},0)/d.totalBalance : 6;
    compState = {principal:10000, monthly:state.monthlyContribution, rate:Math.round(blendedGrowth*10)/10, years:state.targetAge-state.currentAge};
  }
  var fv=compState.principal, contributed=compState.principal;
  var mg=Math.pow(1+compState.rate/100,1/12)-1;
  for(var m=0;m<compState.years*12;m++){ fv*=1+mg; fv+=compState.monthly; contributed+=compState.monthly; }
  var growthPart=fv-contributed;
  return '<div class="grid4" style="margin-bottom:12px;">'+
    field("Starting amount","c.principal",compState.principal,"AUD","setComp('principal',this.value)")+
    field("Monthly contribution","c.monthly",compState.monthly,"AUD","setComp('monthly',this.value)")+
    field("Annual growth","c.rate",compState.rate,"%","setComp('rate',this.value)")+
    field("Years","c.years",compState.years,"yrs","setComp('years',this.value)")+
    '</div>'+
    '<div class="grid3">'+
      readout("Future value", fmtFull(fv),"","#4FC3D9")+
      readout("Total contributed", fmtFull(contributed),"principal + monthly amounts","#D9A441")+
      readout("Growth earned", fmtFull(growthPart), ((growthPart/contributed*100)||0).toFixed(0)+"% on top of what you put in","#6FBE8F")+
    '</div>';
}
function setComp(field,value){
  if(compState===null) return;
  var bounds={principal:{min:0}, monthly:{min:0}, rate:{min:-50,max:100}, years:{min:0,max:80}};
  var n=parseNumInput(value, bounds[field]);
  if(n===null){ render(); return; }
  compState[field]=n;
  render();
}
window.setComp=setComp;

  var creditNow = state.stocks.reduce(function(s,st){return s+st.balance*((st.yieldGrossed-st.yieldCash)/100);},0);
  var res2026 = dividendTaxImpact(state.tax.salary, d.currentRunRateCash, creditNow, 2026);
  var res2025 = dividendTaxImpact(state.tax.salary, d.currentRunRateCash, creditNow, 2025);
  h+='<div class="card"><h2>Dividend tax today '+helpBtn("h-tdiv")+'</h2>'+
    helpBox("h-tdiv","Cash dividends plus franking credits (grossed up at the 30% company tax rate) get added to your taxable income. The franking credit is then subtracted from the tax bill as an offset. If it's more than the extra tax the dividends caused, you get a net refund of the difference, this is common at lower incomes and very common with zero salary in retirement.")+
    '<div class="grid4">'+
      readout("Cash dividends", fmtFull(d.currentRunRateCash),"per year","#4FC3D9")+
      readout("Franking credits", fmtFull(creditNow),"grossed-up add-back","#D9A441")+
      readout("Assessable amount", fmtFull(res2026.grossedUp),"added to taxable income","#8593A3")+
      readout(res2026.net<=0?"Net refund":"Net extra tax", fmtFull(Math.abs(res2026.net)),"2026-27 rates",res2026.net<=0?"#6FBE8F":"#D9695F")+
    '</div>'+
    '<div style="font-size:11px;color:#5B6A78;margin-top:8px;">Under 2025-26 rates this would have been '+(res2025.net<=0?"a "+fmtFull(-res2025.net)+" refund":"an extra "+fmtFull(res2025.net)+" owed")+' — the only difference is the second tax bracket (16% vs 15%).</div>'+
  '</div>';

  h+='<div class="card"><h2>CGT calculator '+helpBtn("h-cgt")+'</h2>'+
    helpBox("h-cgt","Pick a holding, how much of it you\'d sell, and at what age. This projects the balance and cost base at that point (cost base = everything ever paid in, including reinvested dividends) and compares tax under two regimes: what the old flat 50% discount would have given you, versus the law actually passed in the 2026 Budget (Royal Assent 26 Jun 2026): the 50% discount still applies to gains that accrued before 1 July 2027, but gains after that date use CPI-indexed cost base with a 30% minimum tax rate on the real gain instead. This is a simplified average-cost model for education, not a substitute for an accountant working from your real parcels and dates.")+
    '<div class="grid3" style="margin-bottom:12px;">'+
      '<label class="field">Sell which holding'+
        '<select data-field="tax-sellStockId" onchange="setField(\'tax.sellStockId\',parseInt(this.value))" style="background:#0F1720;border:1px solid #26333F;border-radius:6px;color:#EAF1F6;padding:6px 8px;">'+
          state.stocks.map(function(s){ return '<option value="'+s.id+'" '+(state.tax.sellStockId===s.id?"selected":"")+'>'+esc(s.ticker)+'</option>'; }).join("")+
        '</select></label>'+
      field("Percent to sell","tax.sellPercent",state.tax.sellPercent,"%","setField('tax.sellPercent',this.value,true,{min:0,max:100})")+
      field("Age at sale","tax.sellAge",state.tax.sellAge,"yrs","setField('tax.sellAge',this.value,true,{min:0,max:120})")+
    '</div>'+
    renderCgtResult(d)+
  '</div>';

  h+='<div class="card"><h2>CGT &amp; tax notes worth knowing '+helpBtn("h-cgttips")+'</h2>'+
    helpBox("h-cgttips","General education, not personal advice. Always run actual sale decisions past an accountant, especially once real money and real dates are involved.")+
    '<ul style="font-size:12.5px;color:#8593A3;line-height:1.7;padding-left:18px;">'+
      '<li>The 50% CGT discount only applies to assets held over 12 months, and only to gains that accrued before 1 July 2027. There is no minimum tax on that portion.</li>'+
      '<li>From 1 July 2027, the discount is replaced by CPI indexation of the cost base, and a 30% minimum tax applies to the real (indexed) gain, even if your marginal rate would otherwise be lower.</li>'+
      '<li>Selling in a low-income year (career break, between jobs, early retirement) still helps for the pre-2027 portion of any gain, but the 30% floor limits how much that trick saves you on gains accruing after the reform date.</li>'+
      '<li>Franking credits are only worth their full grossed-up value if your taxable income is low enough that year for them to be refunded in full, this is one reason early retirement years can be tax-efficient for dividend income specifically.</li>'+
      '<li>Selling a small slice each financial year instead of one lump sum can keep you inside a lower bracket for the gain, worth modelling both ways before a big sale.</li>'+
      '<li>This calculator assumes a simple average cost base per holding. Real portfolios often have multiple purchase parcels with different dates, which can be chosen individually at sale time to legally minimise tax, an accountant can optimise this in a way this tool cannot.</li>'+
    '</ul>'+
  '</div>';

  return h;
}

function renderCgtResult(d){
  var sellMonth=(state.tax.sellAge-state.currentAge)*12;
  if(sellMonth<1){
    return '<div class="warnbox">Sale age must be after your current age. Adjust the age above.</div>';
  }
  var yieldField = d.yieldField;
  var snapArr = (yieldField==="yieldCash")?d.simCash:d.simGrossed;
  var idx=Math.min(sellMonth, snapArr.length)-1;
  var snapshot=snapArr[idx];
  var frac=(state.tax.sellPercent||0)/100;
  var cmp=cgtCompare(snapshot, state.tax.sellStockId, frac, state.tax.salary, state.inflation, sellMonth+1, d.sellFee);
  var s=state.stocks.find(function(x){return x.id===state.tax.sellStockId;});
  return '<div style="font-size:11.5px;color:#5B6A78;margin-bottom:8px;">At age '+state.tax.sellAge+', selling '+state.tax.sellPercent+'% of '+esc(s?s.ticker:"?")+' (projected on the '+(yieldField==="yieldCash"?"cash":"grossed-up")+' yield basis, after a '+fmtPrecise(d.sellFee)+' broker sell fee deducted from proceeds):</div>'+
  '<div class="taxcompare">'+
    '<div class="taxcol old"><h3>If 2025 rules had continued</h3>'+
      '<div class="line"><span>Total capital gain</span><b>'+fmtFull(cmp.totalGainOld)+'</b></div>'+
      '<div class="line"><span>After 50% discount</span><b>'+fmtFull(cmp.taxableOld)+'</b></div>'+
      '<div class="line total"><span>CGT payable</span><b style="color:#D9695F;">'+fmtFull(cmp.taxOld)+'</b></div>'+
    '</div>'+
    '<div class="taxcol new"><h3>Actual 2026 law (from 1 Jul 2027)</h3>'+
      '<div class="line"><span>Pre-reform gain (50% discount)</span><b>'+fmtFull(cmp.taxablePreDiscounted)+'</b></div>'+
      '<div class="line"><span>Post-reform real gain (indexed)</span><b>'+fmtFull(cmp.realGainPost)+'</b></div>'+
      '<div class="line total"><span>CGT payable</span><b style="color:#D9695F;">'+fmtFull(cmp.taxNew)+'</b></div>'+
    '</div>'+
  '</div>'+
  '<div style="font-size:11.5px;color:'+(cmp.taxNew>cmp.taxOld?"#D9695F":"#6FBE8F")+';margin-top:8px;">'+
    (cmp.taxNew>cmp.taxOld ? "Under the actual 2026 law this sale costs about "+fmtFull(cmp.taxNew-cmp.taxOld)+" more in CGT than the old rules would have." :
     "Under the actual 2026 law this sale costs about "+fmtFull(cmp.taxOld-cmp.taxNew)+" less in CGT than the old rules would have.")+
  '</div>';
}

/* ============================== RENDER: INSIGHTS TAB ============================== */

function renderInsights(d){
  var suggestions=[];
  var targetMonth=d.targetMonth;
  if(targetMonth>0 && state.stocks.length>0){
    var yieldField=d.yieldField;
    var currentPlanRes = yieldField==="yieldCash"?d.simCash:d.simGrossed;
    var crossMonth = findCrossingMonth(currentPlanRes, state.targetDividend, d.inflRate);
    var behind = !crossMonth || crossMonth>targetMonth;
    if(behind){
      var reqContribution = yieldField==="yieldCash"?d.reqContribCash:d.reqContribGrossed;
      var extra = reqContribution!=null? Math.max(0, reqContribution-state.monthlyContribution) : null;
      suggestions.push({icon:"⚡", title:"Lift contributions to hit age "+state.targetAge,
        body: (extra!=null && extra>10) ? ("You'd need about "+fmtFull(reqContribution)+"/month combined (up from "+fmtFull(state.monthlyContribution)+") on the "+(yieldField==="yieldCash"?"cash":"grossed-up")+" basis to hit "+fmtFull(state.targetDividend)+" by age "+state.targetAge+". That's an extra "+fmtFull(extra)+"/month starting now.") : "Your current contribution is already enough on this basis.",
        deadline:"Start now, review yearly"});
      var lump = solveLumpSum({stocks:state.stocks, monthlyContribution:state.monthlyContribution, reallocation:d.reallocation, yieldField:yieldField, sequence:d.seq, brokerBuyFee:d.brokerBuyFee}, targetMonth, state.targetDividend, d.inflRate, d.highestYieldStock?d.highestYieldStock.id:null);
      suggestions.push({icon:"📈", title:"One-off lump sum, same monthly contribution",
        body:"A single lump sum of about "+fmtFull(lump)+", added today to "+(d.highestYieldStock?d.highestYieldStock.ticker:"your highest-yield holding")+", would close the gap to age "+state.targetAge+" without changing your monthly contribution.",
        deadline:"Whenever a lump sum becomes available"});
      suggestions.push({icon:"💰", title:"Franking credits are worth more with a lower salary",
        body:"Your dividend tax position on the Tax & CGT tab assumes your current salary. If you drop to part-time or take a career break before hitting your target, franking credits get refunded at a higher rate, worth modelling that scenario there directly.",
        deadline:"Model this whenever income changes"});
    } else {
      var surplusYears = crossMonth ? (targetMonth-crossMonth)/12 : 0;
      var minContribution = solveMonthlyContribution({stocks:state.stocks, reallocation:d.reallocation, yieldField:yieldField, sequence:d.seq, brokerBuyFee:d.brokerBuyFee}, targetMonth, state.targetDividend, d.inflRate);
      suggestions.push({icon:"🎯", title:"You're ahead of schedule",
        body:"At current settings you're on track to hit the target about "+surplusYears.toFixed(1)+" years before age "+state.targetAge+". You could drop contributions to roughly "+fmtFull(minContribution)+"/month and still make it, or keep the pace and retire earlier.",
        deadline:"Recheck this in 12 months"});
    }
  }
  var sellMonth=(state.tax.sellAge-state.currentAge)*12;
  if(sellMonth>0){
    var beforeReform = sellMonth <= MONTHS_UNTIL_REFORM;
    suggestions.push({icon: beforeReform?"⏳":"📊", title: beforeReform? "Your planned sale age lands before the CGT reform" : "Your planned sale age lands after the CGT reform",
      body: beforeReform? "At age "+state.tax.sellAge+" (before 1 July 2027) any gain on the holding you've picked in the CGT calculator would still get the old 50% discount with no minimum tax floor. Selling before the cut-off, if it otherwise makes sense, locks that in." :
        "At age "+state.tax.sellAge+" (after 1 July 2027) the gain accrued from that date is taxed on the indexed real amount with a 30% floor. Check the CGT tab to see exactly how much of the projected gain falls on each side of the line.",
      deadline:"Review closer to age "+state.tax.sellAge});
  }
  if(d.feeImpact.gap>500){
    suggestions.push({icon:"💸", title:"Fees are a real drag on this plan",
      body:"Between "+esc(BROKER_DB[state.broker.id]?BROKER_DB[state.broker.id].name:"your broker")+" brokerage and fund management fees, this plan is projected to cost about "+fmtFull(d.feeImpact.gap)+" in portfolio value by age "+(d.targetMonth>0?state.targetAge:(state.currentAge+40))+" compared to a hypothetical zero-fee version. Consolidating contributions into fewer, larger trades (e.g. quarterly instead of monthly) cuts brokerage roughly proportionally, and switching a holding to a lower-MER equivalent (see Other holdings to consider) cuts the ongoing drag.",
      deadline:"Review broker and fund choices anytime"});
  }
  suggestions.push({icon:"ℹ️", title:"Get the structure question checked",
    body:"Whether some of this belongs inside super or an investment bond instead of your personal name depends on your income trajectory and timeline, worth a session with an accountant once you're within 5 to 10 years of the target, not now.",
    deadline:"Revisit around age "+Math.max(state.currentAge+1, state.targetAge-8)});

  var h='<div class="card"><h2>What needs to happen to reach the goal '+helpBtn("h-ins")+'</h2>'+
    helpBox("h-ins","Recalculates as you change anything on the page. If you're behind your target age it works out the extra contribution, lump sum, or timing move needed to close the gap. If you're ahead, it tells you how much room you have.")+
    '<div style="position:relative;padding-left:6px;">'+suggestions.map(function(s){
      return '<div class="insight"><div class="marker">'+s.icon+'</div>'+
        '<div class="ititle">'+esc(s.title)+'</div>'+
        '<div class="ibody">'+esc(s.body)+'</div>'+
        '<div class="ideadline">'+esc(s.deadline)+'</div></div>';
    }).join("")+'</div>'+
  '</div>';

  var portfolioIdeas = Object.keys(STOCK_DB).filter(function(t){ return !state.stocks.some(function(s){return s.ticker===t;}); })
    .map(function(t){ return Object.assign({ticker:t}, STOCK_DB[t]); }).sort(function(a,b){return b.yieldCash-a.yieldCash;});
  h+='<div class="card"><h2>Other holdings to consider '+helpBtn("h-ideas")+'</h2>'+
    helpBox("h-ideas","General information about how these funds have historically behaved, not a personal recommendation. Higher yield almost always trades off against diversification, growth, or concentration risk, add one via Holdings to model its real effect.")+
    '<div class="cardsub">Your current blended cash yield is <b style="color:#EAF1F6;font-family:monospace;">'+fmtPct(d.blendedYieldCash*100)+'</b>.</div>'+
    '<div class="scrollhint">&larr; swipe to see all columns &rarr;</div>'+
    '<div class="table-scroll wide">'+
    '<table><thead><tr><th>Ticker</th><th>What it is</th><th>Cash yield</th><th>Grossed yield</th><th>Growth</th><th>MER</th><th>Verify</th></tr></thead><tbody>'+
    portfolioIdeas.map(function(idea){
      return '<tr><td><b>'+esc(idea.ticker)+'</b></td><td style="color:#8593A3;max-width:220px;">'+esc(idea.note)+'</td>'+
        '<td style="color:#4FC3D9;">'+idea.yieldCash.toFixed(1)+'%</td><td style="color:#D9A441;">'+idea.yieldGrossed.toFixed(1)+'%</td><td style="color:#6FBE8F;">'+idea.growth.toFixed(1)+'%</td>'+
        '<td style="color:#8593A3;">'+(idea.mer||0).toFixed(2)+'%</td>'+
        '<td>'+asxLinkHtml(idea.ticker, idea.isETF)+'</td></tr>';
    }).join("")+'</tbody></table></div>'+
  '</div>';

  return h;
}

function renderCompare(d){

  var baseCross = yieldField==="yieldCash"?d.crossCashMonth:d.crossGrossedMonth;
  var h='<div class="card"><h2>Scenario comparison '+helpBtn("h-scen")+
    '<button class="btn small primary" style="margin-left:auto;" onclick="addScenario()">+ Add scenario</button></h2>'+
    helpBox("h-scen","Test changes side by side without touching your main plan. Each row is an independent what-if: extra monthly contribution, redirecting money into a holding from a chosen age, or both.")+
    '<div class="scrollhint">&larr; swipe to see all columns &rarr;</div>'+
    '<div class="table-scroll wide">'+
    '<table><thead><tr><th>Scenario</th><th>Extra $/mo</th><th>Reallocate to</th><th>From age</th><th>Monthly total</th><th>Years to target</th><th>Hits at age</th><th></th></tr></thead><tbody>'+
    '<tr><td><span class="dot" style="background:#4FC3D9;"></span> Current plan</td><td>—</td>'+
    '<td>'+(state.reallocTargets.length?state.reallocTargets.map(function(id){var s=state.stocks.find(function(x){return x.id===id;});return s?s.ticker:"";}).join(", "):"—")+'</td>'+
    '<td>'+(state.reallocAge!=null?state.reallocAge:"—")+'</td>'+
    '<td>'+fmtFull(state.monthlyContribution)+'</td>'+
    '<td style="color:#6FBE8F;">'+(baseCross?(baseCross/12).toFixed(1):"40+")+'</td>'+
    '<td>'+(baseCross?(state.currentAge+baseCross/12).toFixed(1):"—")+'</td><td></td></tr>';
  state.scenarios.forEach(function(s){
    var realloc = s.reallocateAge? {thresholdMonth:(s.reallocateAge-state.currentAge)*12, targetIds:[s.targetId]} : null;
    var res=simulateMulti({stocks:state.stocks, monthlyContribution:state.monthlyContribution+s.contributionDelta, months:d.months, reallocation:realloc, yieldField:yieldField, sequence:d.seq, brokerBuyFee:d.brokerBuyFee});
    var crossM=findCrossingMonth(res, state.targetDividend, d.inflRate);
    h+='<tr><td><span class="dot" style="background:'+s.color+';"></span> <input type="text" data-field="scenario-'+s.id+'-label" value="'+esc(s.label)+'" style="width:100px;background:transparent;border:none;color:#EAF1F6;" oninput="updateScenario('+s.id+',\'label\',this.value)"/></td>'+
      '<td><input type="text" inputmode="decimal" data-field="scenario-'+s.id+'-contributionDelta" step="50" value="'+s.contributionDelta+'" style="width:80px;" oninput="updateScenario('+s.id+',\'contributionDelta\',this.value)"/></td>'+
      '<td><select data-field="scenario-'+s.id+'-targetId" onchange="updateScenario('+s.id+',\'targetId\',this.value)" style="background:#0F1720;border:1px solid #26333F;border-radius:6px;color:#EAF1F6;">'+
        state.stocks.map(function(st){return '<option value="'+st.id+'" '+(s.targetId===st.id?"selected":"")+'>'+esc(st.ticker)+'</option>';}).join("")+'</select></td>'+
      '<td><input type="text" inputmode="decimal" data-field="scenario-'+s.id+'-reallocateAge" step="1" value="'+(s.reallocateAge||"")+'" placeholder="—" style="width:60px;" oninput="updateScenario('+s.id+',\'reallocateAge\',this.value)"/></td>'+
      '<td>'+fmtFull(state.monthlyContribution+s.contributionDelta)+'</td>'+
      '<td style="color:#6FBE8F;">'+(crossM?(crossM/12).toFixed(1):"40+")+'</td>'+
      '<td>'+(crossM?(state.currentAge+crossM/12).toFixed(1):"—")+'</td>'+
      '<td><button class="btn small danger" onclick="removeScenario('+s.id+')">&times;</button></td></tr>';
  });
  h+='</tbody></table></div><div style="font-size:10px;color:#5B6A78;margin-top:6px;">Uses the '+(yieldField==="yieldCash"?"cash":"grossed-up")+' yield basis (set at the top of the page).</div></div>';
  return h;
}

/* ============================== EXPORT / REPORT ============================== */

function assembleReportData(d){
  var creditNow = state.stocks.reduce(function(s,st){return s+st.balance*((st.yieldGrossed-st.yieldCash)/100);},0);
  var divTax = dividendTaxImpact(state.tax.salary, d.currentRunRateCash, creditNow, 2026);

  var cgt=null;
  var sellMonth=(state.tax.sellAge-state.currentAge)*12;
  if(sellMonth>0){
    var yieldFieldForCgt = d.yieldField;
    var snapArr = (yieldFieldForCgt==="yieldCash")?d.simCash:d.simGrossed;
    var idx=Math.min(sellMonth, snapArr.length)-1;
    var snapshot=snapArr[idx];
    var frac=(state.tax.sellPercent||0)/100;
    var sellStock=state.stocks.find(function(x){return x.id===state.tax.sellStockId;});
    if(sellStock){
      var cmp=cgtCompare(snapshot, state.tax.sellStockId, frac, state.tax.salary, state.inflation, sellMonth+1, d.sellFee);
      cgt={stock:sellStock.ticker, percent:state.tax.sellPercent, age:state.tax.sellAge, cmp:cmp};
    }
  }

  var contribModeLabel = (state.contribMode==="custom" && state.customSequence.length>0)
    ? "Custom pattern: "+state.customSequence.map(function(id){var s=state.stocks.find(function(x){return x.id===id;});return s?s.ticker:"?";}).join(" \u2192 ")
    : "Rotates evenly: "+state.stocks.map(function(s){return s.ticker;}).join(" \u2192 ");

  var reallocation = (state.reallocAge!=null && state.reallocTargets.length>0)
    ? {age:state.reallocAge, targets:state.reallocTargets.map(function(id){var s=state.stocks.find(function(x){return x.id===id;});return s?s.ticker:"?";})}
    : null;

  var scenarios = state.scenarios.map(function(s){
    var realloc = s.reallocateAge? {thresholdMonth:(s.reallocateAge-state.currentAge)*12, targetIds:[s.targetId]} : null;
    var res=simulateMulti({stocks:state.stocks, monthlyContribution:state.monthlyContribution+s.contributionDelta, months:d.months, reallocation:realloc, yieldField:d.yieldField, sequence:d.seq, brokerBuyFee:d.brokerBuyFee});
    var crossM=findCrossingMonth(res, state.targetDividend, d.inflRate);
    var targetStock=state.stocks.find(function(x){return x.id===s.targetId;});
    return {label:s.label, monthlyTotal:state.monthlyContribution+s.contributionDelta, targetTicker:targetStock?targetStock.ticker:"?",
      reallocateAge:s.reallocateAge, years:crossM?crossM/12:null, age:crossM?state.currentAge+crossM/12:null};
  });

  return {
    generatedAt:new Date(),
    plan:{currentAge:state.currentAge, targetAge:state.targetAge, targetDividend:state.targetDividend, monthlyContribution:state.monthlyContribution,
      inflation:state.inflation, adjustInflation:state.adjustInflation, yieldView:state.yieldView},
    contribModeLabel:contribModeLabel,
    reallocation:reallocation,
    broker:{name:(BROKER_DB[state.broker.id]?BROKER_DB[state.broker.id].name:state.broker.id), buyFee:state.broker.buyFee, sellFee:state.broker.sellFee},
    holdings:state.stocks.map(function(s){return {ticker:s.ticker, name:s.name, balance:s.balance, yieldCash:s.yieldCash, yieldGrossed:s.yieldGrossed, growth:s.growth, mer:s.mer||0};}),
    results:{crossCashMonth:d.crossCashMonth, crossGrossedMonth:d.crossGrossedMonth, currentRunRateCash:d.currentRunRateCash,
      blendedYieldCash:d.blendedYieldCash, portfolioNeeded:d.blendedYieldCash>0?state.targetDividend/d.blendedYieldCash:null, feeImpact:d.feeImpact},
    growthSensitivity:d.growthSensitivity, yieldSensitivity:d.yieldSensitivity,
    tax:{salary:state.tax.salary, cashDiv:d.currentRunRateCash, frankingCredit:creditNow, grossedUp:divTax.grossedUp, net:divTax.net},
    cgt:cgt, scenarios:scenarios
  };
}

/* Canvas-based PNG/JPEG renderer. Runs the same layout twice: once to measure the total height
   needed, then again on a correctly-sized canvas to actually draw, so nothing gets cut off. */
function drawReportCanvas(rd){
  var W=1100, marginX=60, contentW=W-marginX*2;
  function run(ctx, draw, canvasRef){
    var y=50;
    function setFont(size,weight){ ctx.font=(weight||"400")+" "+size+"px Arial,Helvetica,sans-serif"; }
    function text(str,x,size,weight,color){
      setFont(size,weight);
      if(draw){ ctx.fillStyle=color||"#181818"; ctx.fillText(str,x,y); }
      y+=Math.round(size*1.45);
    }
    function wrapText(str,x,size,color){
      setFont(size,"400");
      var words=String(str).split(" "), line="";
      words.forEach(function(w){
        var test=line?line+" "+w:w;
        if(ctx.measureText(test).width>contentW-(x-marginX) && line){
          if(draw){ ctx.fillStyle=color||"#666"; ctx.fillText(line,x,y); }
          y+=Math.round(size*1.5); line=w;
        } else line=test;
      });
      if(line){ if(draw){ ctx.fillStyle=color||"#666"; ctx.fillText(line,x,y); } y+=Math.round(size*1.5); }
    }
    function hr(color){ y+=6; if(draw){ ctx.strokeStyle=color||"#ddd"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(marginX,y); ctx.lineTo(W-marginX,y); ctx.stroke(); } y+=16; }
    function sectionTitle(str){ y+=10; text(str,marginX,16,"700","#12233F"); hr("#12233F"); }
    function kvRow(pairs){
      var colW=contentW/pairs.length;
      pairs.forEach(function(p,i){
        var x=marginX+i*colW;
        setFont(11,"400"); if(draw){ ctx.fillStyle="#666"; ctx.fillText(String(p[0]),x,y); }
        setFont(13,"700"); if(draw){ ctx.fillStyle="#111"; ctx.fillText(String(p[1]),x,y+17); }
      });
      y+=40;
    }
    function roundRectPath(x,y,w,hgt,r){
      ctx.beginPath();
      ctx.moveTo(x+r,y);
      ctx.arcTo(x+w,y,x+w,y+hgt,r);
      ctx.arcTo(x+w,y+hgt,x,y+hgt,r);
      ctx.arcTo(x,y+hgt,x,y,r);
      ctx.arcTo(x,y,x+w,y,r);
      ctx.closePath();
    }
    function table(headers, rows, widths, highlightIndex){
      var x=marginX;
      if(draw){ ctx.fillStyle="#12233F"; ctx.fillRect(marginX-8,y-16,contentW+16,24); }
      setFont(9.5,"700");
      headers.forEach(function(hh,i){
        var colRight=x+widths[i]-8;
        if(draw){ ctx.fillStyle="#DCE6F2"; ctx.textAlign=(i===0?"left":"right"); ctx.fillText(String(hh).toUpperCase(), i===0?x:colRight, y); }
        x+=widths[i];
      });
      ctx.textAlign="left";
      y+=36;
      rows.forEach(function(row,ri){
        if(draw && ri%2===1){ ctx.fillStyle="#F7F9FC"; ctx.fillRect(marginX-8,y-15,contentW+16,22); }
        if(draw && ri===highlightIndex){ ctx.fillStyle="#EAF1FA"; ctx.fillRect(marginX-8,y-15,contentW+16,22); }
        x=marginX; setFont(12,"400");
        row.forEach(function(cell,i){
          var colRight=x+widths[i]-8;
          if(draw){ ctx.fillStyle="#222"; ctx.textAlign=(i===0?"left":"right"); ctx.fillText(String(cell), i===0?x:colRight, y); }
          x+=widths[i];
        });
        ctx.textAlign="left";
        y+=24;
      });
      y+=10;
    }

    ctx.textAlign="left";
    if(draw){ ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,canvasRef.width,canvasRef.height); }

    var headerH=124;
    if(draw){ ctx.fillStyle="#12233F"; ctx.fillRect(0,0,canvasRef.width,headerH); }
    setFont(10,"700"); if(draw){ ctx.fillStyle="#8FB4DE"; ctx.fillText("PERSONAL FINANCIAL PLAN \u2014 PREPARED FOR DISCUSSION", marginX, 34); }
    setFont(24,"700"); if(draw){ ctx.fillStyle="#ffffff"; ctx.fillText("Dividend & FIRE Income Plan", marginX, 70); }
    setFont(12,"400"); if(draw){ ctx.fillStyle="#B7C8DE"; ctx.fillText("Generated "+rd.generatedAt.toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"})+" \u2014 for discussion with a financial adviser or accountant, not financial advice itself.", marginX, 96); }
    y=headerH+40;

    var boxTop=y-26, boxH=92;
    if(draw){ ctx.fillStyle="#12233F"; roundRectPath(marginX-10, boxTop, contentW+20, boxH, 10); ctx.fill(); }
    var stats=[
      ["YEARS TO TARGET (CASH YIELD)", rd.results.crossCashMonth?(rd.results.crossCashMonth/12).toFixed(1)+" yrs":"40+ yrs"],
      ["TARGET HIT AT AGE", rd.results.crossCashMonth?(rd.plan.currentAge+rd.results.crossCashMonth/12).toFixed(1):"\u2014"],
      ["TODAY'S DIVIDEND INCOME", fmtFull(rd.results.currentRunRateCash)],
      ["TARGET DIVIDEND INCOME", fmtFull(rd.plan.targetDividend)]
    ];
    var statColW=contentW/stats.length;
    stats.forEach(function(s,i){
      var sx=marginX+i*statColW;
      setFont(9.5,"700"); if(draw){ ctx.fillStyle="#9FB8D6"; ctx.fillText(s[0], sx, boxTop+26); }
      setFont(21,"700"); if(draw){ ctx.fillStyle="#ffffff"; ctx.fillText(s[1], sx, boxTop+58); }
    });
    y=boxTop+boxH+34;

    sectionTitle("Plan snapshot");
    kvRow([["Current age",rd.plan.currentAge],["Target retirement age",rd.plan.targetAge]]);
    kvRow([["Monthly contribution",fmtFull(rd.plan.monthlyContribution)],["Target dividend income",fmtFull(rd.plan.targetDividend)+"/yr"]]);
    kvRow([["Contribution pattern",rd.contribModeLabel],["Broker",rd.broker.name+" ("+fmtPrecise(rd.broker.buyFee)+"/trade)"]]);
    if(rd.reallocation) kvRow([["Reallocation plan","From age "+rd.reallocation.age+" \u2192 "+rd.reallocation.targets.join(", ")]]);

    sectionTitle("Key results");
    kvRow([["Years to target (cash yield)", rd.results.crossCashMonth?(rd.results.crossCashMonth/12).toFixed(1)+" yrs":"40+ yrs"],
           ["Years to target (grossed-up)", rd.results.crossGrossedMonth?(rd.results.crossGrossedMonth/12).toFixed(1)+" yrs":"40+ yrs"]]);
    kvRow([["Today's dividend income", fmtFull(rd.results.currentRunRateCash)],["Portfolio size needed", rd.results.portfolioNeeded?fmtFull(rd.results.portfolioNeeded):"—"]]);

    sectionTitle("Holdings");
    table(["Ticker","Balance","Cash yld","Grossed yld","Growth","MER"],
      rd.holdings.map(function(hh){ return [hh.ticker, fmtFull(hh.balance), hh.yieldCash.toFixed(1)+"%", hh.yieldGrossed.toFixed(1)+"%", hh.growth.toFixed(1)+"%", hh.mer.toFixed(2)+"%"]; }),
      [90,190,140,150,110,110]);

    sectionTitle("If growth turns out different (cash-yield basis)");
    table(["Growth adj.","Years to target","Hits at age"],
      rd.growthSensitivity.map(function(r){ return [(r.delta>0?"+":"")+r.delta+"%", r.years?r.years.toFixed(1):"40+", r.age?r.age.toFixed(1):"—"]; }),
      [200,260,200], rd.growthSensitivity.findIndex(function(r){return r.delta===0;}));

    sectionTitle("If yield turns out different (cash-yield basis)");
    table(["Yield adj.","Years to target","Hits at age"],
      rd.yieldSensitivity.map(function(r){ return [(r.delta>0?"+":"")+r.delta+"%", r.years?r.years.toFixed(1):"40+", r.age?r.age.toFixed(1):"—"]; }),
      [200,260,200], rd.yieldSensitivity.findIndex(function(r){return r.delta===0;}));

    sectionTitle("Fees");
    wrapText("Based on "+rd.broker.name+" brokerage of "+fmtPrecise(rd.broker.buyFee)+" per purchase (and "+fmtPrecise(rd.broker.sellFee)+" per sale), charged once for whichever holding is bought each month, plus each fund's own management fee (MER, shown per holding above).", marginX, 11, "#666");
    y+=6;
    kvRow([["Brokerage fee per purchase", fmtPrecise(rd.broker.buyFee)+" ("+rd.broker.name+")"],["Brokerage paid by target age", fmtFull(rd.results.feeImpact.brokerageSoFar)]]);
    kvRow([["Value lost to fees vs zero-fee plan", fmtFull(rd.results.feeImpact.gap)]]);

    sectionTitle("Dividend tax (at salary "+fmtFull(rd.tax.salary)+")");
    kvRow([["Cash dividends", fmtFull(rd.tax.cashDiv)],["Franking credits", fmtFull(rd.tax.frankingCredit)]]);
    kvRow([[rd.tax.net<=0?"Net refund":"Net extra tax", fmtFull(Math.abs(rd.tax.net))]]);

    if(rd.cgt){
      sectionTitle("CGT scenario: selling "+rd.cgt.percent+"% of "+rd.cgt.stock+" at age "+rd.cgt.age);
      table(["Rules","Taxable gain","CGT payable"], [
        ["2025 rules continued", fmtFull(rd.cgt.cmp.taxableOld), fmtFull(rd.cgt.cmp.taxOld)],
        ["Actual 2026 law", fmtFull(rd.cgt.cmp.taxablePreDiscounted+rd.cgt.cmp.realGainPost), fmtFull(rd.cgt.cmp.taxNew)]
      ], [320,330,330]);
    }

    if(rd.scenarios.length){
      sectionTitle("Scenario comparison");
      table(["Scenario","Monthly total","Years to target","Hits at age"],
        rd.scenarios.map(function(s){ return [s.label, fmtFull(s.monthlyTotal), s.years?s.years.toFixed(1):"40+", s.age?s.age.toFixed(1):"—"]; }),
        [340,260,230,150]);
    }

    y+=8; hr("#ccc");
    wrapText("This is a planning and education tool, not financial, tax or legal advice. Yield, growth, tax, CGT and fee figures are assumptions and simplifications, not guarantees. Generated entirely in a browser; nothing entered into this tool is stored or sent anywhere.", marginX, 10.5, "#888");

    return y+30;
  }

  var measure=document.createElement("canvas"); measure.width=W; measure.height=10;
  var totalHeight=run(measure.getContext("2d"), false, measure);
  var canvas=document.createElement("canvas");
  canvas.width=W; canvas.height=Math.ceil(totalHeight);
  run(canvas.getContext("2d"), true, canvas);
  return canvas;
}

function printReport(){
  var d=derive();
  var rd=assembleReportData(d);
  var docHtml=buildReportDocumentHTML(rd);
  var blob=new Blob([docHtml], {type:"text/html"});
  var url=URL.createObjectURL(blob);
  var w=window.open(url, "_blank");
  if(!w){ URL.revokeObjectURL(url); alert("Your browser blocked the popup needed to build the printable report. Please allow popups for this page and click Print again."); return; }
  var fired=false;
  function doPrint(){
    if(fired) return; fired=true;
    try{ w.focus(); w.print(); }catch(e){}
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  }
  // Print once the new tab has actually finished loading the report, this is more reliable across
  // mobile browsers than a fixed timeout guessing how long rendering takes.
  try{ w.addEventListener("load", doPrint); }catch(e){}
  setTimeout(doPrint, 700); // fallback for browsers that don't fire load on a same-window popup navigation
}
function downloadReportImage(format){
  try{
    var d=derive();
    var rd=assembleReportData(d);
    var canvas=drawReportCanvas(rd);
    var mime = format==="jpeg" ? "image/jpeg" : "image/png";
    var url = canvas.toDataURL(mime, format==="jpeg"?0.92:undefined);
    var a=document.createElement("a");
    a.href=url;
    a.download = "dividend-fire-report."+(format==="jpeg"?"jpg":"png");
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(e){
    alert("Couldn't generate the image in this browser. Try the Print / Save as PDF option instead, or a different browser.");
  }
}
window.printReport=printReport;
window.downloadReportImage=downloadReportImage;

    focusInfo={
      field:active.dataset.field,
      rawValue:("value" in active)?active.value:null,
      selStart:(typeof active.selectionStart==="number")?active.selectionStart:null,
